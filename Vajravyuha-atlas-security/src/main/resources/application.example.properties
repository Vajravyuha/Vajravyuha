# Application
spring.application.name=atlas

# Vulnerability scanning
atlas.scan.default-environment=development
atlas.scan.trivy-path=trivy
atlas.scan.target-path=.
atlas.security.service-token=${ATLAS_SERVICE_TOKEN}

# PostgreSQL database
spring.datasource.url=${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlasdb}
spring.datasource.username=${ATLAS_DB_USERNAME:atlasuser}
spring.datasource.password=${ATLAS_DB_PASSWORD}

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# JPA and timezone
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secret encryption
atlas.security.encryption-key=${ATLAS_ENCRYPTION_KEY}