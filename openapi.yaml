openapi: 3.0.3

info:
  title: Atlas Security Scanning API
  version: 1.0.0
  description: API contract between Nexus Core and Atlas for synchronous container image vulnerability scanning.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Scans
    description: Container image security scanning

  - name: Secrets
    description: Secure application secret storage and retrieval

paths:
  /api/v1/scans:
    post:
      tags:
        - Scans
      summary: Scan a container image before deployment
      description: |
        Core submits a deployment request. Atlas scans the specified image
        using Trivy and returns vulnerability counts and a deployment decision.
        The current policy blocks deployment when at least one critical
        vulnerability is detected.
      operationId: scanImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
            example:
              deployId: dep_8f3a21
              appName: payment-gateway
              environment: production
              image: registry.local/payment-gateway:v1.0
              commitSha: a1b2c3d
              requestedBy: core
      responses:
        '200':
          description: Image scan completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
              examples:
                passed:
                  summary: No critical vulnerabilities detected
                  value:
                    deployId: dep_8f3a21
                    appName: payment-gateway
                    environment: production
                    status: PASSED
                    criticalCount: 0
                    highCount: 2
                    mediumCount: 3
                    lowCount: 5
                    message: No critical vulnerabilities detected
                blocked:
                  summary: Critical vulnerabilities detected
                  value:
                    deployId: dep_8f3a21
                    appName: payment-gateway
                    environment: production
                    status: BLOCKED
                    criticalCount: 1
                    highCount: 2
                    mediumCount: 3
                    lowCount: 5
                    message: Deployment blocked due to critical vulnerabilities

        '400':
          description: Invalid request or malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
              example:
                error: INVALID_REQUEST
                message: Request body is missing or invalid JSON
                deployId: null

        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
              example:
                error: UNAUTHORIZED
                message: Invalid service token
                deployId: null

        '404':
          description: Container image could not be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
              example:
                error: IMAGE_NOT_FOUND
                message: Could not retrieve the requested container image
                deployId: dep_8f3a21

        '422':
          description: Container image could not be scanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
              example:
                error: IMAGE_UNSCANNABLE
                message: The requested container image could not be scanned
                deployId: dep_8f3a21

        '504':
          description: Vulnerability scan timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
              example:
                error: SCAN_TIMEOUT
                message: Trivy scan timed out
                deployId: dep_8f3a21

        '500':
          description: Internal scanner or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
              example:
                error: INTERNAL_ERROR
                message: Trivy failed to complete the vulnerability scan
                deployId: dep_8f3a21

  /api/v1/applications/{appName}/secrets:
    put:
      tags:
        - Secrets
      summary: Store or update application secrets
      operationId: storeApplicationSecrets
      security:
        - bearerAuth: []
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSecretsRequest'
            example:
              secrets:
                DATABASE_PASSWORD: dummy-password
                JWT_SECRET: dummy-jwt-secret
      responses:
        '200':
          description: Secrets stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSecretsResponse'
              example:
                appName: payment-gateway
                status: SUCCESS
                message: Secrets stored successfully
                secretCount: 2
        '400':
          description: Invalid request or secret data
        '401':
          description: Missing or invalid service token

    get:
      tags:
        - Secrets
      summary: Retrieve application secrets
      description: |
        Retrieves the application's stored secrets.
        Atlas decrypts the secrets before returning them.
        Only authorized Core services should call this endpoint,
        after verifying that the deployment is authorized to access them.
      operationId: retrieveApplicationSecrets
      security:
        - bearerAuth: []
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Application secrets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveSecretsResponse'
              example:
                DATABASE_PASSWORD: dummy-password
                JWT_SECRET: dummy-jwt-secret

        '400':
          description: Invalid application name or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'

        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'

        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'

        '500':
          description: Internal server or secret decryption error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceToken

  schemas:
    ScanRequest:
      type: object
      required:
        - deployId
        - appName
        - environment
        - image
        - commitSha
        - requestedBy
      properties:
        deployId:
          type: string
          example: dep_8f3a21
        appName:
          type: string
          example: payment-gateway
        environment:
          type: string
          example: production
        image:
          type: string
          description: Container image reference that Atlas must scan.
          example: registry.local/payment-gateway:v1.0
        commitSha:
          type: string
          example: a1b2c3d
        requestedBy:
          type: string
          example: core

    ScanResponse:
      type: object
      required:
        - deployId
        - appName
        - environment
        - status
        - criticalCount
        - highCount
        - mediumCount
        - lowCount
        - message
      properties:
        deployId:
          type: string
        appName:
          type: string
        environment:
          type: string
        status:
          type: string
          enum:
            - PASSED
            - BLOCKED
        criticalCount:
          type: integer
          minimum: 0
        highCount:
          type: integer
          minimum: 0
        mediumCount:
          type: integer
          minimum: 0
        lowCount:
          type: integer
          minimum: 0
        message:
          type: string

    ScanError:
      type: object
      required:
        - error
        - message
        - deployId
      properties:
        error:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHORIZED
            - IMAGE_NOT_FOUND
            - IMAGE_UNSCANNABLE
            - SCAN_TIMEOUT
            - INTERNAL_ERROR
        message:
          type: string
        deployId:
          type: string
          nullable: true

    StoreSecretsRequest:
      type: object
      required:
        - secrets
      properties:
        secrets:
          type: object
          minProperties: 1
          additionalProperties:
            type: string

    StoreSecretsResponse:
      type: object
      required:
        - appName
        - status
        - message
        - secretCount
      properties:
        appName:
          type: string
        status:
          type: string
          enum:
            - SUCCESS
        message:
          type: string
        secretCount:
          type: integer
          minimum: 1
    RetrieveSecretsResponse:
      type: object
      description: Map of secret names to their decrypted values.
      additionalProperties:
        type: string